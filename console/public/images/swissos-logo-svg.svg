<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 145" width="645" height="145">
  <defs>
    <style>
      .brand { fill:#4391EA; }
      .mark  { fill:#FFFFFF; }
      .seam  { fill:none; stroke:#4391EA; stroke-width:5; stroke-linecap:round; }
    </style>
  </defs>

  <g transform="translate(4,4)">
    <!-- Badge -->
    <rect x="0" y="0" width="137" height="137" rx="30" class="brand"/>

    <!-- Database cylinder icon -->
    <g>
      <path class="mark" d="M 37 40 L 37 97 A 31.5 12 0 0 0 100 97 L 100 40 Z"/>
      <ellipse class="mark" cx="68.5" cy="40" rx="31.5" ry="12"/>
      <path class="seam" d="M 40 61 A 28.5 10.3 0 0 0 97 61"/>
      <path class="seam" d="M 40 80 A 28.5 10.3 0 0 0 97 80"/>
    </g>

    <!-- Wordmark -->
    <text x="168" y="103" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="96" letter-spacing="-2" class="brand">SwissOS</text>
  </g>
</svg>
